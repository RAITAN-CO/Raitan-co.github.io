title: RAITAN
description: "Custom battery systems, solar energy solutions, and subsea engineering — engineered and assembled to specification in Singapore."
url: "https://raitan-co.github.io"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-feed

collections:
  posts:
    output: true
    permalink: /news/:year-:month-:day-:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"

# Listed explicitly (not relying on Jekyll's built-in defaults) because
# older Jekyll releases (e.g. the 3.x line bundled by the github-pages
# gem) replace the default exclude list entirely instead of merging with
# it once a custom `exclude:` key is present in this file.
exclude:
  - docs
  - README.md
  - .superpowers
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .bundle
